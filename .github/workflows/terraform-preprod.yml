
name: Terraform Preprod Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

env:
  TF_VERSION: "1.10.5"
  TF_DIR: "environments/preprod"
  TF_IN_AUTOMATION: "true"

  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}

jobs:

  terraform-init:
    name: Terraform Init
    runs-on: [self-hosted, linux, x64]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Azure CLI
        shell: bash
        run: |
          if ! command -v az >/dev/null 2>&1; then
            curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash
          fi
          az version

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: >-
            {
              "clientId": "${{ secrets.AZURE_CLIENT_ID }}",
              "clientSecret": "${{ secrets.AZURE_CLIENT_SECRET }}",
              "subscriptionId": "${{ secrets.AZURE_SUBSCRIPTION_ID }}",
              "tenantId": "${{ secrets.AZURE_TENANT_ID }}"
            }

      - name: Verify Azure Login
        run: az account show --output table

      - name: Terraform Init
        working-directory: ${{ env.TF_DIR }}
        shell: bash
        run: |
          terraform init \
            -input=false \
            -backend-config="resource_group_name=23-10-2026ramji" \
            -backend-config="storage_account_name=ramjist" \
            -backend-config="container_name=ramjist1" \
            -backend-config="key=tfstate23" \
            -backend-config="subscription_id=${ARM_SUBSCRIPTION_ID}" \
            -backend-config="tenant_id=${ARM_TENANT_ID}" \
            -backend-config="use_cli=true" \
            -backend-config="use_azuread_auth=true"

  terraform-validate:
    name: Terraform Validate
    runs-on: [self-hosted, linux, x64]
    needs: terraform-init

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: >-
            {
              "clientId": "${{ secrets.AZURE_CLIENT_ID }}",
              "clientSecret": "${{ secrets.AZURE_CLIENT_SECRET }}",
              "subscriptionId": "${{ secrets.AZURE_SUBSCRIPTION_ID }}",
              "tenantId": "${{ secrets.AZURE_TENANT_ID }}"
            }

      - name: Terraform Init
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform init \
            -input=false \
            -backend-config="resource_group_name=23-10-2026ramji" \
            -backend-config="storage_account_name=ramjist" \
            -backend-config="container_name=ramjist1" \
            -backend-config="key=tfstate23" \
            -backend-config="subscription_id=${ARM_SUBSCRIPTION_ID}" \
            -backend-config="tenant_id=${ARM_TENANT_ID}" \
            -backend-config="use_cli=true" \
            -backend-config="use_azuread_auth=true"

      - name: Terraform Validate
        working-directory: ${{ env.TF_DIR }}
        run: terraform validate

  terraform-plan:
    name: Terraform Plan
    runs-on: [self-hosted, linux, x64]
    needs: terraform-validate

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: >-
            {
              "clientId": "${{ secrets.AZURE_CLIENT_ID }}",
              "clientSecret": "${{ secrets.AZURE_CLIENT_SECRET }}",
              "subscriptionId": "${{ secrets.AZURE_SUBSCRIPTION_ID }}",
              "tenantId": "${{ secrets.AZURE_TENANT_ID }}"
            }

      - name: Terraform Init
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform init \
            -input=false \
            -backend-config="resource_group_name=23-10-2026ramji" \
            -backend-config="storage_account_name=ramjist" \
            -backend-config="container_name=ramjist1" \
            -backend-config="key=tfstate23" \
            -backend-config="subscription_id=${ARM_SUBSCRIPTION_ID}" \
            -backend-config="tenant_id=${ARM_TENANT_ID}" \
            -backend-config="use_cli=true" \
            -backend-config="use_azuread_auth=true"

      - name: Terraform Plan
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform plan \
            -input=false \
            -out=tfplan

      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-preprod-plan
          path: ${{ env.TF_DIR }}/tfplan
          retention-days: 5
